[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rllm"
version = "0.2.0"
description = "Reinforcement Learning for Language Agents"
authors = [
    {name = "rLLM Team"}
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = {file = "LICENSE"}
dependencies = [
    # NOTE: scripts/install_verl.sh installs the pinned torch / vLLM / SGLang /
    # flash-attn stack *first*. The bounds below exist so that `pip install -e .`
    # afterwards cannot silently upgrade torch or numpy out from under it.

    # Core ML
    "torch>=2.6,<2.7",
    "transformers>=4.51,<5",
    "numpy<2.0.0",
    "torchdata",

    # Data processing
    "datasets",
    "pandas",
    "polars",
    "pyarrow>=19.0.1",
    "pillow",

    # Distributed / config / logging
    "ray[default]",
    "hydra-core",
    "omegaconf",
    "wandb",

    # Rollout + reward
    "openai",
    "httpx",
    "voyageai",          # embedding-similarity reward (examples/asp/code_embedding.py)
    "matplotlib",        # imported by BigCodeBench unit tests at reward time
    "sympy",
    "pylatexenc",
    "antlr4-python3-runtime==4.9.3",

    # Utilities
    "click",
    "tqdm",
    "rich",
    "PyYAML",
    "pydantic>=2.9",
    "wrapt",
    "pyzmq",
    "filelock",
]

[project.optional-dependencies]

# Upstream rLLM tool integrations. Not used by examples/asp; install only if you
# are pulling those agents back in.
tools = [
    "e2b_code_interpreter",
    "together>=1.4",
    "firecrawl",
    "mcp",
    "camel-ai",
    "sentence-transformers",
]

dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "mypy",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-autorefs>=0.5.0",
    "pymdown-extensions>=10.0.0",
]

[tool.ruff]
line-length = 5000 # TODO: Reduce this to a more reasonable value

[tool.ruff.lint]
isort = {known-first-party = ["rllm"]}
# c.f. https://github.com/vllm-project/vllm/blob/ce8d6b75fc0586045df75ee1568a5b5f9957251b/pyproject.toml
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    # `.log()` statement uses f-string
    "G004",
    # equality check using x == True
    "E712", 
]

[tool.ruff.lint.per-file-ignores]
"rllm/rewards/code_utils/**" = ["ALL"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["rllm", "rllm.*"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

exclude = [
    "verl/.*",
    "rllm/rewards/code_utils/.*",
    "rllm/rewards/math_utils/.*",
    "examples/.*",
    "scripts/.*",
    "tests/.*",
    "docs/.*",
]
